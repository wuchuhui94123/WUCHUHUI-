# === 主要策略组 ===
🚀 节点选择 = select, "🇨🇳 中国直连", "🌍 全局代理", no-alert=0, hidden=0, include-all-proxies=0

# 全局代理 - 自动选择最优地区
🌍 全局代理 = select, "🇭🇰 香港节点", "🇹🇼 台湾节点", "🇯🇵 日本节点", "🇸🇬 新加坡节点", "🇺🇸 美国节点", "🇰🇷 韩国节点", "🇬🇧 英国节点", no-alert=0, hidden=0, include-all-proxies=0

# === 所有订阅节点（已更新新地址）===
# 重要：订阅链接10分钟后失效，需要手动更新
# 更新方法：前往官网获取新链接 → Surge策略组 → 📡 所有节点 → 点击刷新
📡 所有节点 = select, policy-path=https://45.137.181.25/api/getData/Authorize?token=4fdac984107929eae94d7e7322e611ec, update-interval=0, no-alert=0, hidden=0, include-all-proxies=0, policy-regex-filter=^((?!Remain|Expired|官网|如需|套餐|去除|剩余|距离|Reset|重置|流量).)+$

# === 地区节点分组 ===
# 香港节点 - 智能选择（自动测速）
🇭🇰 香港节点 = smart, update-interval=0, policy-regex-filter=港|🇭🇰|香港|HK|Hong, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=📡 所有节点

# 台湾节点
🇹🇼 台湾节点 = smart, update-interval=0, policy-regex-filter=台|🇹🇼|台湾|TW|Tai, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=📡 所有节点

# 日本节点
🇯🇵 日本节点 = smart, update-interval=0, policy-regex-filter=日|🇯🇵|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=📡 所有节点

# 新加坡节点
🇸🇬 新加坡节点 = smart, update-interval=0, policy-regex-filter=新|坡|🇸🇬|新加坡|狮城|SG|Singapore, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=📡 所有节点

# 美国节点 - 添加fallback和负载均衡机制
🇺🇸 美国节点 = url-test, update-interval=0, policy-regex-filter=美|🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=📡 所有节点, interval=600, tolerance=100, timeout=5

# 韩国节点
🇰🇷 韩国节点 = smart, update-interval=0, policy-regex-filter=韩|🇰🇷|韩国|首尔|KR|Korea, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=📡 所有节点

# 英国节点
🇬🇧 英国节点 = smart, update-interval=0, policy-regex-filter=英|🇬🇧|英国|伦敦|UK|United Kingdom, no-alert=0, hidden=0, include-all-proxies=0, include-other-group=📡 所有节点

