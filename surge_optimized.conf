[Header Rewrite]
# === HTTP 头重写 ===
# 重要：Claude 相关请求不进行 Header 重写

# 知乎优化
http-request ^https?:\/\/.*\.zhihu\.com\/(question|topic) header-replace User-Agent "osee2unifiedRelease/4432 osee2unifiedReleaseVersion/7.8.0 Mozilla/5.0 (iPhone; CPU iPhone OS 14_4 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148"

# GitHub 优化
http-request ^https:\/\/github\.com\/ header-replace Accept-Language en-us
http-request ^https:\/\/(raw|gist)\.githubusercontent\.com\/ header-replace Accept-Language en-us

[MITM]
# === MITM 设置（Claude Code 专用优化）===
#
# ⚠️ 关键配置：
# 1. 所有 AI 服务域名已完全排除（使用 "-" 前缀）
# 2. 保护 TLS 指纹不被修改
# 3. 确保与指纹浏览器兼容
# 4. 保证 Claude Code 连接稳定性

# 跳过服务器证书验证
skip-server-cert-verify = true
# TCP 连接
tcp-connection = true
# HTTP/2 支持
h2 = true

# MITM 主机名配置
# 关键：所有 AI 服务域名使用 "-" 前缀排除，不进行 MITM 解密
hostname = www.google.cn, api.abema.io, *.zhihu.com, github.com, raw.githubusercontent.com, gist.githubusercontent.com, -*.anthropic.com, -anthropic.com, -*.claude.ai, -claude.ai, -api.anthropic.com, -*.claudeusercontent.com, -claudeusercontent.com, -*.openai.com, -openai.com, -api.openai.com, -*.google.com, -*.googleapis.com

# 证书配置
ca-passphrase = 69ACD5DC
